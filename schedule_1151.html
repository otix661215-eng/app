        .panel.active { display: block; }
        .teacher-grid {

        .teacher-card {

function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById(tab).classList.add('active');
    if (tab === 'stats') renderStats();
}

function getSlots(name) {
    return scheduleData[name] || {};
}

function renderTeacherGrid() {
    const grid = document.getElementById('teacherGrid');
    const names = Object.keys(scheduleData);
    if (names.length === 0) {
        grid.innerHTML = '<p style="text-align:center;color:#999;padding:40px;">尚無課表資料</p>';
        return;
    }
    grid.innerHTML = names.map(name => {
        const slots = getSlots(name);
        const keys = Object.keys(slots).sort();
        const items = keys.map(key => {
            const s = slots[key];
            const detail = (s.class ? ' <span class="slot-detail">' + s.class + '</span>' : '') +
                          (s.room ? ' <span class="slot-detail">' + s.room + '</span>' : '');
            return '<div class="schedule-item"><span class="day">' + key + '</span>' +
                   '<span class="slots"><span class="course-name">' + s.course + '</span>' + detail + '</span></div>';
        }).join('');
        return '<div class="teacher-card"><div class="teacher-name">' + name + '</div>' + items + '</div>';
    }).join('');
}

function queryFree() {
    const day = document.getElementById('queryDay').value;
    const start = parseInt(document.getElementById('queryStart').value);
    const end = parseInt(document.getElementById('queryEnd').value);
    const result = document.getElementById('queryResult');
    
    if (start > end) {
        result.innerHTML = '<p style="color:red;">起始節次不能大於結束節次</p>';
        return;
    }
    
    const freeTeachers = [];
    const busyTeachers = [];
    
    Object.keys(scheduleData).forEach(name => {
        const slots = getSlots(name);
        const busySlots = [];
        for (let i = start; i <= end; i++) {
            const key = day + ' ' + i;
            if (slots[key]) {
                busySlots.push({ slot: i, ...slots[key] });
            }
        }
        if (busySlots.length === 0) {
            freeTeachers.push(name);
        } else {
            busyTeachers.push({ name, busySlots });
        }
    });
    
    let html = '<div class="result-box free-result">';
    html += '<div class="result-title">📊 查詢結果：' + day + ' 第' + start + '-' + end + '節</div>';
    
    if (freeTeachers.length > 0) {
        html += '<p style="margin-bottom:10px;font-weight:bold;color:#2e7d32;">✅ 空堂老師（' + freeTeachers.length + '人）</p>';
        html += '<div class="teacher-list">' + freeTeachers.map(n => '<span class="teacher-tag free">' + n + '</span>').join('') + '</div>';
    } else {
        html += '<p style="color:#2e7d32;">沒有空堂老師</p>';
    }
    
    if (busyTeachers.length > 0) {
        html += '<p style="margin:15px 0 10px;font-weight:bold;color:#c62828;">❌ 有課老師（' + busyTeachers.length + '人）</p>';
        html += '<div class="busy-list">';
        busyTeachers.forEach(t => {
            html += '<div class="busy-detail-card"><div class="busy-teacher-name">' + t.name + '</div>';
            t.busySlots.forEach(s => {
                html += '<div class="busy-class-item"><span class="busy-period">第' + s.slot + '節</span>' +
                        '<span class="busy-course">' + s.course + '</span>' +
                        '<span class="busy-info">' + (s.class || '') + ' ' + (s.room || '') + '</span></div>';
            });
            html += '</div>';
        });
        html += '</div>';
    }
    html += '</div>';
    result.innerHTML = html;
}

    const dayCount = { '週一': 0, '週二': 0, '週三': 0, '週四': 0, '週五': 0 };
    const courseSet = new Set();
    
    names.forEach(name => {
        const slots = getSlots(name);
        totalSlots += Object.keys(slots).length;
        Object.keys(slots).forEach(key => {
            const day = key.split(' ')[0];
            if (dayCount[day] !== undefined) dayCount[day]++;
            courseSet.add(slots[key].course);
        });
    });
    
    let html = '<div style="margin-bottom:20px;">';
    html += '<div class="stat-box"><div class="stat-num">' + names.length + '</div><div class="stat-label">老師人數</div></div>';
    html += '<div class="stat-box"><div class="stat-num">' + totalSlots + '</div><div class="stat-label">總時段數</div></div>';
    html += '<div class="stat-box"><div class="stat-num">' + courseSet.size + '</div><div class="stat-label">不同課程數</div></div>';
    html += '</div>';
    
    html += '<h3 style="margin:20px 0 10px;">各星期課堂數</h3><div style="text-align:left;max-width:500px;margin:0 auto;">';
    const days = ['週一', '週二', '週三', '週四', '週五'];
    const dayNames = ['星期一', '星期二', '星期三', '星期四', '星期五'];
    days.forEach((d, i) => {
        const pct = totalSlots > 0 ? (dayCount[d] / totalSlots * 100).toFixed(1) : 0;
        html += '<div style="margin:8px 0;"><span style="display:inline-block;width:70px;font-weight:bold;">' + dayNames[i] + '</span>' +
                '<div style="display:inline-block;width:' + (dayCount[d] * 3) + 'px;height:20px;background:#667eea;border-radius:10px;vertical-align:middle;"></div>' +
                ' <span style="font-weight:bold;">' + dayCount[d] + '</span> (' + pct + '%)</div>';
    });
    html += '</div>';
    
    html += '<h3 style="margin:25px 0 10px;">每位老師時段數</h3><div style="text-align:left;max-width:500px;margin:0 auto;">';
    names.sort((a, b) => Object.keys(getSlots(b)).length - Object.keys(getSlots(a)).length).forEach(name => {
        const cnt = Object.keys(getSlots(name)).length;
        html += '<div style="margin:6px 0;"><span style="display:inline-block;width:80px;font-weight:bold;">' + name + '</span>' +
                '<div style="display:inline-block;width:' + (cnt * 4) + 'px;height:18px;background:linear-gradient(90deg,#667eea,#764ba2);border-radius:9px;vertical-align:middle;"></div>' +
                ' <span style="font-weight:bold;">' + cnt + '</span></div>';
    });
    html += '</div>';
    
    div.innerHTML = html;
}

renderTeacherGrid();
</script>
</body>
</html>
