<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>115-1 電子系 老師課表查詢系統</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 {
            color: white; text-align: center; margin-bottom: 10px;
            font-size: 2.2em; text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .subtitle { color: rgba(255,255,255,0.8); text-align: center; margin-bottom: 25px; font-size: 1.1em; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn {
            padding: 12px 24px; border: none; border-radius: 25px; cursor: pointer;
            font-size: 16px; font-weight: bold; transition: all 0.3s;
            background: rgba(255,255,255,0.2); color: white;
        }
        .tab-btn:hover { background: rgba(255,255,255,0.3); transform: translateY(-2px); }
        .tab-btn.active { background: white; color: #667eea; }
        .panel {
            background: white; border-radius: 20px; padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3); display: none;
        }
        .panel.active { display: block; }
        .teacher-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 20px; margin-top: 20px;
        }
        .teacher-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 15px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .teacher-name {
            font-size: 1.4em; font-weight: bold; color: #333; margin-bottom: 15px;
            padding-bottom: 10px; border-bottom: 2px solid #667eea;
        }
        .schedule-item {
            display: flex; padding: 8px 0; border-bottom: 1px solid rgba(0,0,0,0.08);
        }
        .schedule-item:last-child { border-bottom: none; }
        .day { font-weight: bold; color: #667eea; min-width: 45px; }
        .slots { color: #555; flex: 1; }
        .slot-detail { font-size: 0.85em; color: #777; margin-left: 8px; }
        .course-name { color: #333; font-weight: bold; }
        .query-section { text-align: center; }
        .query-section h2 { color: #333; margin-bottom: 20px; }
        .form-row { display: flex; gap: 15px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
        .form-group { text-align: left; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        .form-group select {
            padding: 10px 15px; border: 2px solid #ddd; border-radius: 10px;
            font-size: 16px; font-family: inherit; min-width: 100px;
        }
        .query-btn {
            padding: 12px 30px; background: #667eea; color: white; border: none;
            border-radius: 25px; font-size: 16px; font-weight: bold; cursor: pointer;
            transition: all 0.3s;
        }
        .query-btn:hover { background: #5a6fd6; transform: translateY(-2px); }
        .result-box { margin-top: 25px; padding: 20px; border-radius: 15px; text-align: center; }
        .free-result { background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); }
        .result-title { font-size: 1.4em; font-weight: bold; margin-bottom: 15px; }
        .teacher-list { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .teacher-tag { padding: 8px 16px; border-radius: 20px; font-weight: bold; }
        .teacher-tag.free { background: #4CAF50; color: white; }
        .teacher-tag.busy { background: #f44336; color: white; }
        .busy-detail-card {
            background: white; border-radius: 12px; padding: 12px 16px; margin: 8px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: left;
        }
        .busy-detail-card .busy-teacher-name {
            font-size: 1.1em; font-weight: bold; color: #c62828; margin-bottom: 8px;
            padding-bottom: 6px; border-bottom: 2px solid #ffcdd2;
        }
        .busy-detail-card .busy-class-item {
            display: flex; padding: 4px 0; border-bottom: 1px solid #f5f5f5; font-size: 14px;
        }
        .busy-detail-card .busy-class-item:last-child { border-bottom: none; }
        .busy-detail-card .busy-period { font-weight: bold; color: #667eea; min-width: 70px; margin-right: 8px; }
        .busy-detail-card .busy-course { font-weight: bold; color: #333; margin-right: 6px; }
        .busy-detail-card .busy-info { color: #888; font-size: 13px; }
        .busy-list { margin-top: 10px; }
        .stat-box { display: inline-block; margin: 5px; padding: 10px 20px; background: #f0f0f0; border-radius: 10px; }
        .stat-num { font-size: 1.8em; font-weight: bold; color: #667eea; }
        .stat-label { font-size: 0.9em; color: #777; }
        .updated-tag { color: rgba(255,255,255,0.6); text-align: center; font-size: 0.8em; margin-top: 10px; }
    </style>
</head>
<body>
<div class="container">
    <h1>🏫 115-1 電子系 老師課表查詢系統</h1>
    <p class="subtitle">明新科技大學 電子工程系 115學年度第1學期</p>
    <p class="updated-tag">最後更新：2026-09-07</p>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('list')">📋 老師課表</button>
        <button class="tab-btn" onclick="switchTab('query')">🔍 查詢空堂</button>
        <button class="tab-btn" onclick="switchTab('stats')">📊 統計</button>
    </div>
    
    <!-- 老師課表列表 -->
    <div id="list" class="panel active">
        <div class="teacher-grid" id="teacherGrid"></div>
    </div>
    
    <!-- 查詢空堂 -->
    <div id="query" class="panel">
        <div class="query-section">
            <h2>🔍 查詢空堂老師</h2>
            <div class="form-row">
                <div class="form-group">
                    <label>星期</label>
                    <select id="queryDay">
                        <option value="週一">星期一</option>
                        <option value="週二">星期二</option>
                        <option value="週三">星期三</option>
                        <option value="週四">星期四</option>
                        <option value="週五">星期五</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>從第幾節</label>
                    <select id="queryStart">
                        <option value="1">1</option><option value="2">2</option><option value="3">3</option>
                        <option value="4">4</option><option value="5">5</option><option value="6">6</option>
                        <option value="7">7</option><option value="8">8</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>到第幾節</label>
                    <select id="queryEnd">
                        <option value="1">1</option><option value="2">2</option><option value="3">3</option>
                        <option value="4">4</option><option value="5">5</option><option value="6">6</option>
                        <option value="7">7</option><option value="8">8</option>
                    </select>
                </div>
            </div>
            <button class="query-btn" onclick="queryFree()">🔍 查詢</button>
            <div id="queryResult"></div>
        </div>
    </div>
    
    <!-- 統計 -->
    <div id="stats" class="panel">
        <div class="query-section">
            <h2>📊 課表統計</h2>
            <div id="statsContent"></div>
        </div>
    </div>
</div>

<script>
// ===== 課表資料 =====
// 格式: "老師名": { "週X N": { course, class, room } }
// 依序新增中...
const scheduleData = {
    "鄭文源": {
        "週二 1": {"course": "產業實務實習(三)-校外實習", "class": "攜子僑三甲", "room": ""},
        "週二 2": {"course": "電路學(一)", "class": "攜子僑二甲", "room": "明明樓四樓407教室"},
        "週二 3": {"course": "電路學(一)", "class": "攜子僑二甲", "room": "明明樓四樓407教室"},
        "週二 4": {"course": "電路學(一)", "class": "攜子僑二甲", "room": "明明樓四樓407教室"},
        "週三 5": {"course": "光復高中", "class": "", "room": ""},
        "週三 6": {"course": "光復高中", "class": "", "room": ""},
        "週三 7": {"course": "光復高中", "class": "", "room": ""},
        "週四 1": {"course": "產業實務實習(三)-校外實習", "class": "攜子僑二甲", "room": ""},
        "週四 2": {"course": "數位邏輯實習", "class": "四子二乙", "room": "電子大樓三樓307電子電路實驗室"},
        "週四 3": {"course": "數位邏輯實習", "class": "四子二乙", "room": "電子大樓三樓307電子電路實驗室"},
        "週四 4": {"course": "實務專題", "class": "四子三甲", "room": ""},
        "週四 5": {"course": "電路學(一)", "class": "四子一甲", "room": "明光樓二樓202教室"},
        "週四 6": {"course": "電路學(一)", "class": "四子一甲", "room": "明光樓二樓202教室"},
        "週四 7": {"course": "電路學(一)", "class": "四子一甲", "room": "明光樓二樓202教室"},
        "週五 1": {"course": "光復高中", "class": "", "room": ""},
        "週五 2": {"course": "光復高中", "class": "", "room": ""},
        "週五 3": {"course": "光復高中", "class": "", "room": ""},
        "週五 4": {"course": "光復高中", "class": "", "room": ""}
    },
    "江培成": {
        "週四 1": {"course": "產業實務實習(三)-校外實習", "class": "攜子僑三甲", "room": ""},
        "週四 2": {"course": "工程倫理", "class": "四子三甲", "room": "明光樓二樓203教室"},
        "週四 3": {"course": "工程倫理", "class": "四子三甲", "room": "明光樓二樓203教室"},
        "週四 4": {"course": "工程數學(一)", "class": "四子二甲", "room": "明光樓二樓203教室"},
        "週五 1": {"course": "工程數學(一)", "class": "四子二甲", "room": "明光樓二樓203教室"},
        "週五 2": {"course": "工程數學(一)", "class": "四子二甲", "room": "明光樓二樓203教室"}
    },
    "王木俊": {
        "週四 2": {"course": "半導體元件物理", "class": "碩子一甲", "room": "明光樓三樓302教室"},
        "週四 3": {"course": "半導體元件物理", "class": "碩子一甲", "room": "明光樓三樓302教室"},
        "週四 4": {"course": "半導體元件物理", "class": "碩子一甲", "room": "明光樓三樓302教室"},
        "週四 5": {"course": "積體電路封裝導論", "class": "四子二甲", "room": "明光樓二樓203教室"},
        "週四 6": {"course": "積體電路封裝導論", "class": "四子二甲", "room": "明光樓二樓203教室"},
        "週四 7": {"course": "積體電路封裝導論", "class": "四子二甲", "room": "明光樓二樓203教室"},
        "週五 2": {"course": "積體電路工程", "class": "四子三甲", "room": "明光樓二樓202教室"},
        "週五 3": {"course": "積體電路工程", "class": "四子三甲", "room": "明光樓二樓202教室"},
        "週五 4": {"course": "積體電路工程", "class": "四子三甲", "room": "明光樓二樓202教室"},
        "週五 5": {"course": "半導體元件", "class": "四子三甲", "room": "明光樓二樓202教室"},
        "週五 6": {"course": "半導體元件", "class": "四子三甲", "room": "明光樓二樓202教室"},
        "週五 7": {"course": "半導體元件", "class": "四子三甲", "room": "明光樓二樓202教室"}
    }
    // 待新增老師...
};


// ===== 節次時間對照 =====
const periodTimes = {
    1: "08:10-09:00", 2: "09:10-10:00", 3: "10:10-11:00", 4: "11:10-12:00",
    5: "13:10-14:00", 6: "14:10-15:00", 7: "15:10-16:00", 8: "16:10-17:00"
};
const dayOrder = ["週一", "週二", "週三", "週四", "週五"];

// ===== 渲染老師課表卡片 =====
function renderTeacherGrid() {
    const grid = document.getElementById("teacherGrid");
    grid.innerHTML = "";
    
    const teacherNames = Object.keys(scheduleData).sort();
    
    teacherNames.forEach(name => {
        const card = document.createElement("div");
        card.className = "teacher-card";
        
        let html = `<div class="teacher-name">${name}</div>`;
        
        const slots = scheduleData[name];
        const grouped = {};
        
        Object.keys(slots).forEach(key => {
            const [day, period] = key.split(" ");
            if (!grouped[day]) grouped[day] = [];
            grouped[day].push({period: parseInt(period), ...slots[key]});
        });
        
        dayOrder.forEach(day => {
            if (grouped[day]) {
                grouped[day].sort((a,b) => a.period - b.period);
                const periods = grouped[day].map(s => s.period);
                const minP = Math.min(...periods), maxP = Math.max(...periods);
                const periodStr = minP === maxP ? `第${minP}節` : `第${minP}-${maxP}節`;
                const timeStr = `${periodTimes[minP]}~${periodTimes[maxP].split("-")[1]}`;
                
                const courses = [...new Set(grouped[day].map(s => s.course))];
                const classes = [...new Set(grouped[day].map(s => s.class).filter(c => c))];
                const rooms = [...new Set(grouped[day].map(s => s.room).filter(r => r))];
                
                html += `<div class="schedule-item">`;
                html += `<div class="day">${day}</div>`;
                html += `<div class="slots"><span class="course-name">${courses.join("、")}</span>`;
                if (classes.length) html += `<span class="slot-detail">${classes.join("、")}</span>`;
                if (rooms.length) html += `<span class="slot-detail">📍${rooms.join("、")}</span>`;
                html += `<div class="slot-detail">${periodStr} (${timeStr})</div></div>`;
                html += `</div>`;
            }
        });
        
        card.innerHTML = html;
        grid.appendChild(card);
    });
}

// ===== 查詢空堂 =====
function queryFree() {
    const day = document.getElementById("queryDay").value;
    const startP = parseInt(document.getElementById("queryStart").value);
    const endP = parseInt(document.getElementById("queryEnd").value);
    
    if (startP > endP) {
        document.getElementById("queryResult").innerHTML = '<div class="result-box free-result"><p>⚠️ 起始節次不能大於結束節次</p></div>';
        return;
    }
    
    const freeTeachers = [];
    const busyTeachers = [];
    
    Object.keys(scheduleData).forEach(name => {
        const slots = scheduleData[name];
        const busySlots = [];
        let isFree = true;
        
        for (let p = startP; p <= endP; p++) {
            const key = `${day} ${p}`;
            if (slots[key]) {
                isFree = false;
                busySlots.push({period: p, ...slots[key]});
            }
        }
        
        if (isFree) {
            freeTeachers.push(name);
        } else {
            busyTeachers.push({name, busySlots});
        }
    });
    
    let html = '<div class="result-box free-result">';
    html += `<div class="result-title">查詢結果：${day} 第${startP}-${endP}節</div>`;
    
    if (freeTeachers.length > 0) {
        html += `<p style="margin-bottom:10px;">✅ 空堂老師 (${freeTeachers.length})</p>`;
        html += '<div class="teacher-list">';
        freeTeachers.forEach(t => html += `<span class="teacher-tag free">${t}</span>`);
        html += '</div>';
    } else {
        html += '<p style="margin-bottom:10px;">😅 沒有空堂老師</p>';
    }
    
    if (busyTeachers.length > 0) {
        html += `<p style="margin:15px 0 10px;">❌ 有課老師 (${busyTeachers.length})</p>`;
        html += '<div class="busy-list">';
        busyTeachers.forEach(t => {
            html += `<div class="busy-detail-card">`;
            html += `<div class="busy-teacher-name">${t.name}</div>`;
            t.busySlots.forEach(s => {
                html += `<div class="busy-class-item">`;
                html += `<span class="busy-period">第${s.period}節</span>`;
                html += `<span class="busy-course">${s.course}</span>`;
                html += `<span class="busy-info">${s.class ? s.class + " " : ""}${s.room ? "📍" + s.room : ""}</span>`;
                html += `</div>`;
            });
            html += `</div>`;
        });
        html += '</div>';
    }
    
    html += '</div>';
    document.getElementById("queryResult").innerHTML = html;
}

// ===== 統計 =====
function renderStats() {
    const teachers = Object.keys(scheduleData);
    let totalSlots = 0;
    const dayCount = {};
    const teacherCount = {};
    
    dayOrder.forEach(d => dayCount[d] = 0);
    
    teachers.forEach(name => {
        const slots = scheduleData[name];
        teacherCount[name] = Object.keys(slots).length;
        totalSlots += Object.keys(slots).length;
        Object.keys(slots).forEach(key => {
            const day = key.split(" ")[0];
            if (dayCount[day] !== undefined) dayCount[day]++;
        });
    });
    
    let html = '';
    html += `<div class="stat-box"><div class="stat-num">${teachers.length}</div><div class="stat-label">老師人數</div></div>`;
    html += `<div class="stat-box"><div class="stat-num">${totalSlots}</div><div class="stat-label">總節數</div></div>`;
    
    dayOrder.forEach(day => {
        html += `<div class="stat-box"><div class="stat-num">${dayCount[day]}</div><div class="stat-label">${day}節數</div></div>`;
    });
    
    html += '<div style="margin-top:20px;"><h3 style="color:#333;margin-bottom:15px;">各老師節數</h3>';
    const sorted = Object.entries(teacherCount).sort((a,b) => b[1] - a[1]);
    sorted.forEach(([name, count]) => {
        html += `<div style="display:flex;justify-content:space-between;padding:8px 15px;border-bottom:1px solid #eee;">`;
        html += `<span style="font-weight:bold;color:#333;">${name}</span>`;
        html += `<span style="color:#667eea;font-weight:bold;">${count} 節</span></div>`;
    });
    html += '</div>';
    
    document.getElementById("statsContent").innerHTML = html;
}

// ===== Tab 切換 =====
function switchTab(tabId) {
    document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
    event.target.classList.add("active");
    document.getElementById(tabId).classList.add("active");
    
    if (tabId === "stats") renderStats();
}

// ===== 初始化 =====
renderTeacherGrid();
</script>
</body>
</html>
