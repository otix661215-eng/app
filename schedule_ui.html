<!DOCTYPE html>
<html lang="zh-TW" data-immersive-translate-page-theme="light"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>老師課表查詢系統</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .tab-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
            background: rgba(255,255,255,0.2);
            color: white;
        }
        
        .tab-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }
        
        .tab-btn.active {
            background: white;
            color: #667eea;
        }
        
        .panel {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: none;
        }
        
        .panel.active {
            display: block;
        }
        
        .teacher-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .teacher-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
        }
        
        .teacher-name {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .card-actions {
            display: flex;
            gap: 6px;
        }
        
        .card-actions button {
            padding: 4px 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        
        .btn-edit {
            background: #667eea;
            color: white;
        }
        .btn-edit:hover {
            background: #5a6fd6;
        }
        
        .btn-delete {
            background: #f44336;
            color: white;
        }
        .btn-delete:hover {
            background: #d32f2f;
        }
        
        .schedule-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }
        
        .schedule-item:last-child {
            border-bottom: none;
        }
        
        .day {
            font-weight: bold;
            color: #667eea;
            min-width: 40px;
        }
        
        .slots {
            color: #555;
            flex: 1;
        }
        
        .slot-detail {
            font-size: 0.85em;
            color: #777;
            margin-left: 8px;
        }
        
        .course-name {
            color: #333;
            font-weight: bold;
        }
        
        .query-section {
            text-align: center;
        }
        
        .query-section h2 {
            color: #333;
            margin-bottom: 20px;
        }
        
        .time-slots-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .time-slot-btn {
            padding: 15px;
            border: 2px solid #667eea;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .time-slot-btn:hover {
            background: #667eea;
            color: white;
        }
        
        .time-slot-btn.selected {
            background: #667eea;
            color: white;
        }
        
        .result-box {
            margin-top: 30px;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }
        
        .free-result {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
        }
        
        .busy-result {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
        }
        
        .result-title {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 15px;
        }
        
        .teacher-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        
        .teacher-tag {
            padding: 8px 16px;
            background: white;
            border-radius: 20px;
            font-weight: bold;
        }
        
        .teacher-tag.free {
            background: #4CAF50;
            color: white;
        }
        
        .teacher-tag.busy {
            background: #f44336;
            color: white;
        }

        .busy-detail-card {
            background: white;
            border-radius: 12px;
            padding: 12px 16px;
            margin: 8px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: left;
        }

        .busy-detail-card .busy-teacher-name {
            font-size: 1.1em;
            font-weight: bold;
            color: #c62828;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 2px solid #ffcdd2;
        }

        .busy-detail-card .busy-class-item {
            display: flex;
            align-items: baseline;
            padding: 4px 0;
            border-bottom: 1px solid #f5f5f5;
            font-size: 14px;
        }

        .busy-detail-card .busy-class-item:last-child {
            border-bottom: none;
        }

        .busy-detail-card .busy-period {
            font-weight: bold;
            color: #667eea;
            min-width: 70px;
            margin-right: 8px;
        }

        .busy-detail-card .busy-course {
            font-weight: bold;
            color: #333;
            margin-right: 6px;
        }

        .busy-detail-card .busy-info {
            color: #888;
            font-size: 13px;
        }

        .busy-list {
            margin-top: 10px;
        }
        
        .add-form {
            max-width: 500px;
            margin: 0 auto;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
        }
        
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .form-group textarea {
            min-height: 200px;
            resize: vertical;
            font-family: "Consolas", monospace;
            font-size: 14px;
        }
        
        .slots-input {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }
        
        .slot-checkbox {
            display: none;
        }
        
        .slot-label {
            padding: 10px;
            text-align: center;
            background: #f0f0f0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 12px;
        }
        
        .slot-checkbox:checked + .slot-label {
            background: #667eea;
            color: white;
        }
        
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s;
        }
        
        .submit-btn:hover {
            transform: scale(1.02);
        }
        
        .submit-btn.secondary {
            background: linear-gradient(135deg, #43a047 0%, #2e7d32 100%);
        }
        
        .submit-btn.warning {
            background: linear-gradient(135deg, #ff9800 0%, #e65100 100%);
        }
        
        .message {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
        }
        
        .import-hint {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #555;
        }
        
        .import-hint code {
            background: #e9ecef;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
        }
        
        .confirm-dialog {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .confirm-box {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .confirm-box h3 {
            margin-bottom: 15px;
            color: #333;
        }
        
        .confirm-box p {
            margin-bottom: 20px;
            color: #666;
        }
        
        .confirm-btns {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        
        .confirm-btns button {
            padding: 10px 24px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .btn-cancel {
            background: #ddd;
            color: #333;
        }
        
        .btn-confirm-del {
            background: #f44336;
            color: white;
        }
    </style>
                </html>
